                  '<div class="dice-ctrl-box"><label>Modificador (-/+)</label><div class="stepper"><button type="button" onclick="window.omniStep(\'d-mod\',-1,-100,100)">−</button><input type="number" id="d-mod" value="0" min="-100" max="100"><button type="button" onclick="window.omniStep(\'d-mod\',1,-100,100)">+</button></div></div>' +
