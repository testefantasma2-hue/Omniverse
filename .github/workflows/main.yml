              ".attr-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }",
              ".attr-block { background: linear-gradient(180deg, #161632 0%, #0b0b1a 100%) !important; border: 1.5px solid #4a3d8f !important; border-radius: 14px !important; padding: 12px 8px !important; }",
              ".omni-save-bar { background: linear-gradient(90deg, #171736, #28193d); border: 1.5px solid #8c6dff; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }",
              ".omni-action-btn { background: #8c6dff; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.78em; cursor: pointer; }",
              ".omni-action-btn.green { background: #2eb872; }",
              ".omni-dice-fab { position: fixed; bottom: 18px; right: 16px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #2b8bf2, #7928ca); border: 2px solid #a8d1ff; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(43, 139, 242, 0.75); cursor: pointer; z-index: 999998; font-size: 24px; }",
              ".omni-dice-sheet { position: fixed; bottom: 84px; right: 12px; width: 330px; max-width: calc(100vw - 24px); background: #111224; border: 1.5px solid #5a67b8; border-radius: 18px; padding: 15px; color: #eae6f8; font-family: sans-serif; box-shadow: 0 16px 45px rgba(0,0,0,0.92); z-index: 999999; display: none; }",
              ".omni-dice-sheet.open { display: block; }",
              ".dice-controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }",
              ".dice-ctrl-box { background: #080914; border: 1px solid #2b3058; border-radius: 10px; padding: 7px; text-align: center; }",
              ".dice-ctrl-box label { display: block; font-size: 0.65em; color: #9b93c4; margin-bottom: 4px; text-transform: uppercase; }",
              ".stepper { display: flex; align-items: center; justify-content: space-between; }",
              ".stepper button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid #3d4478; background: #1a1c38; color: #fff; font-weight: 800; }",
              ".stepper input { width: 48px !important; text-align: center !important; background: transparent !important; border: none !important; color: #fff !important; font-weight: 800 !important; font-size: 1em !important; padding: 0 !important; }",
              ".dice-grid-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }",
              ".die-btn { background: #1c2042; border: 1px solid #485299; border-radius: 9px; padding: 9px 2px; color: #fff; font-weight: 800; font-size: 0.82em; cursor: pointer; text-align: center; }",
              ".die-btn.d100-btn { grid-column: span 2; background: linear-gradient(135deg, #6f42c1, #ef5a63); border-color: #f2c069; }",
              ".dice-result-box { background: #070812; border: 1px solid #303766; border-radius: 10px; padding: 10px; text-align: center; min-height: 68px; }",
