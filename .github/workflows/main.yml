name: Auto-Update Omniverse (ZIP + Qualquer JS + APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Baixar Repositorio
        uses: actions/checkout@v4

      - name: 2. Descompactar ZIPs e Injetar Qualquer .JS automaticamente
        run: |
          # Remove workflow duplicado antigo se existir para evitar conflito
          rm -f .github/workflows/build-apk.yml

          # Extrai qualquer .zip enviado
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d .
              rm -f "$z"
            fi
          done

          # Injeta QUALQUER arquivo .js (exceto sw.js) em todas as paginas HTML
          for script in *.js; do
            if [ -f "$script" ] && [ "$script" != "sw.js" ]; then
              for page in index.html ficha.html dossie.html regras.html bestiario.html; do
                if [ -f "$page" ] && ! grep -q "$script" "$page"; then
                  sed -i "s|</body>|<script src=\"$script\"></script>\n</body>|g" "$page"
                fi
              done
            fi
          done

          # Atualiza versao do cache offline
          if [ -f "sw.js" ]; then
            STAMP=$(date +%s)
            sed -i "s/const CACHE_NAME = .*/const CACHE_NAME = 'omniverse-v-$STAMP';/g" sw.js
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-Update: Modulos sincronizados [skip ci]" || true
          git pull --rebase || true
          git push || true

      - name: 3. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 5. Empacotar Web e Sincronizar Android
        run: |
          npm install
          mkdir -p www
          cp *.html *.json *.js *.svg www/ 2>/dev/null || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 6. Compilar APK Atualizado
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Omniverse-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
