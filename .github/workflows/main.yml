name: Build Omniverse v5 (APK Auto-Versionado)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Baixar Repositorio
        uses: actions/checkout@v4

      - name: 2. Extrair ZIP e Preparar Arquivos
        run: |
          rm -f .github/workflows/build-apk.yml
          rm -rf www android
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o -j "$z" -d . || unzip -o "$z" -d .
              rm -f "$z"
            fi
          done
          echo "self.addEventListener('install',()=>self.skipWaiting());" > sw.js

      - name: 3. Criar Script de Criacao, Salvamento e Dados (addons.js)
        shell: python3 {0}
        run: |
          js_code = r"""
          (function(){
            if(window.__omniV5) return;
            window.__omniV5 = true;

            var isHub = !!document.getElementById('mod-ficha');
            var isFicha = !!document.getElementById('ranking-geral');
            var isDossie = !!document.getElementById('bct-list');

            var KEY_P = 'omni_db_players_v5';
            var KEY_C = 'omni_db_creatures_v5';
            var ACT_P = 'omni_act_p_v5';
            var ACT_C = 'omni_act_c_v5';

            var st = document.createElement('style');
