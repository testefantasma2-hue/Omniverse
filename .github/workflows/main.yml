              sheet.querySelector('#omni-close-dice').onclick = function(){ sheet.classList.remove('open'); };

              window.omniStep = function(id, d, min, max) {
                var el = document.getElementById(id);
                el.value = Math.max(min, Math.min(max, (parseInt(el.value) || 0) + d));
