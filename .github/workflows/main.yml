                  salvarAgora(false);
                }
              };

              window.addEventListener('message', function(ev){
                if (ev.data && ev.data.type === 'OMNI_OPEN_ITEM') {
                  if (isFicha && ev.data.cat === 'players') {
                    localStorage.setItem(ACT_P, ev.data.item.id);
                    aplicarPlayer(ev.data.item.raw);
                  } else if (isDossie && ev.data.cat === 'creatures' && typeof window.applyData === 'function') {
                    localStorage.setItem(ACT_C, ev.data.item.id);
                    window.applyData(ev.data.item.raw);
                  }
                }
              });

              setTimeout(function(){
                var k = isFicha ? KEY_P : KEY_C;
              </div>
                  </div>
                  <div class="dice-ctrl-box">
                    <label>Modificador (-/+)</label>
                    <div class="stepper">
                      <button type="button" onclick="window.omniStep('d-mod',-1,-100,100)">−</button>
                      <input type="number" id="d-mod" value="0" min="-100" max="100">
                      <button type="button" onclick="window.omniStep('d-mod',1,-100,100)">+</button>
                    </div>
                  </div>
                </div>
                <div class="dice-grid-btns">
