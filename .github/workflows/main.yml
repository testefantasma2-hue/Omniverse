                  data.pericias.push({ nome: i[0].value, pct: i[1].value, rank: s[0].value, level: s[1].value });
                });
                document.querySelectorAll('.habilidade-card').forEach(function(c){
                  var i = c.querySelectorAll('input');
                  data.habilidades.push({ nome: i[0].value, tipo: c.querySelector('select').value, custo: i[1].value, desc: c.querySelector('textarea').value });
                });
                document.querySelectorAll('.inv-row').forEach(function(r){
                  var t = r.querySelectorAll('input[type=text]'), n = r.querySelectorAll('input[type=number]');
                  data.inventario.push({ item: t[0].value, qtd: n[0].value, peso: n[1].value, desc: t[1].value, equip: r.querySelector('input[type=checkbox]').checked });
                });
                data.cargaMax = document.getElementById('carga-max') ? document.getElementById('carga-max').value : 100;
                data.historia = document.getElementById('historia') ? document.getElementById('historia').value : '';
                data.portrait = document.getElementById('portrait-img') ? document.getElementById('portrait-img').src : '';
                return data;
              }

              function aplicarPlayer(data) {
                if (!data) return;
                Object.entries(data.basico || {}).forEach(function(kv){ var el = document.getElementById(kv[0]); if (el) el.value = kv[1]; });
                if (typeof window.updateRankingBadge === 'function') window.updateRankingBadge();
                document.getElementById('attr-grid').innerHTML = '';
                (data.atributos || []).forEach(function(a){ window.addAttributeRow(a); });
                document.getElementById('recursos-list').innerHTML = '';
                (data.recursos || []).forEach(function(r){ window.addRecursoRow(r); });
                document.getElementById('pericias-list').innerHTML = '';
                (data.pericias || []).forEach(function(p){ window.addPericiaRow(p); });
                document.getElementById('habilidades-list').innerHTML = '';
                (data.habilidades || []).forEach(function(h){ window.addHabilidadeRow(h); });
                document.getElementById('inventario-list').innerHTML = '';
                (data.inventario || []).forEach(function(i){ window.addInventarioRow(i); });
                if (data.cargaMax) document.getElementById('carga-max').value = data.cargaMax;
                if (data.historia !== undefined) document.getElementById('historia').value = data.historia;
                if (typeof window.updateCarga === 'function') window.updateCarga();
              }

              function salvarAgora(alerta) {
                var hoje = new Date().toLocaleDateString('pt-BR');
                if (isFicha) {
                  var raw = coletarPlayer();
                  var list = getList(KEY_P);
