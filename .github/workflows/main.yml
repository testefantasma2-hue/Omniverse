name: Build Omniverse APK

on:
  push:
    paths:
      - 'omniverse-app.zip'
      - '.github/workflows/build-omniverse-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descompactar o projeto
        run: unzip -q omniverse-app.zip

      - name: Instalar dependências do app
        working-directory: omniverse-app
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android do Capacitor
        working-directory: omniverse-app
        run: npx cap add android

      - name: Sincronizar o app com Android
        working-directory: omniverse-app
        run: npx cap sync android

      - name: Compilar APK de teste
        working-directory: omniverse-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: omniverse-app-debug
          path: omniverse-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
