              "* { box-sizing: border-box; max-width: 100%; }",
              ".book-container, .manual, .shell, .wrap { width: 100% !important; max-width: 100% !important; padding: 12px 10px 95px 10px !important; margin: 0 !important; overflow-x: hidden !important; }",
              "table { display: block !important; width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; font-size: 0.8em !important; }",
              "th, td { white-space: normal !important; min-width: 70px; word-break: break-word; padding: 6px !important; }",
              "h1 { font-size: 1.35em !important; word-break: break-word; }",
              "h2 { font-size: 1.12em !important; word-break: break-word; }",
              ".dossier-header, .dossier-header-bar { display: flex !important; flex-direction: column !important; align-items: center !important; text-align: center !important; gap: 10px !important; padding: 14px 10px !important; }",
              ".creature-name-input { font-size: 1.25em !important; text-align: center !important; }",
              ".sub-field-row { justify-content: center !important; }",
              ".sub-field-row input { width: 100% !important; max-width: 220px !important; }",
              ".photo-slot { margin: 0 auto !important; }",
              ".folder-tabs, .tabs { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 6px !important; padding: 6px !important; }",
              ".folder-tab, .tab-btn { border-radius: 8px !important; transform: none !important; text-align: center !important; padding: 9px 6px !important; font-size: 0.72em !important; }",
              ".competencia-head { display: none !important; }",
              ".competencia-row { display: grid !important; grid-template-columns: 1fr 1fr 1fr !important; gap: 6px !important; padding: 8px !important; background: rgba(0,0,0,0.06); border-radius: 6px; margin-bottom: 8px !important; }",
