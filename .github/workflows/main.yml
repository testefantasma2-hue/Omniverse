name: Auto-Update Omniverse (ZIP + Addons + APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar Repositorio
        uses: actions/checkout@v4

      - name: 2. Descompactar ZIPs e Injetar Atualizacoes (addons.js)
        run: |
          # Se houver algum arquivo .zip recem-enviado, extrai tudo e apaga o .zip para nao acumular
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extraindo $z..."
              unzip -o "$z" -d .
              rm -f "$z"
            fi
          done

          # Se existir o arquivo de melhorias (addons.js), injeta automaticamente nos HTMLs
          if [ -f "addons.js" ]; then
            for page in index.html ficha.html dossie.html regras.html bestiario.html; do
              if [ -f "$page" ] && ! grep -q "addons.js" "$page"; then
                echo "Injetando addons.js em $page..."
                sed -i 's|</body>|<script src="addons.js"></script>\n</body>|g' "$page"
              fi
            done
          fi

          # Atualiza a versao do Cache Offline (Service Worker) com o timestamp atual
          if [ -f "sw.js" ]; then
            STAMP=$(date +%s)
            sed -i "s/const CACHE_NAME = .*/const CACHE_NAME = 'omniverse-v-$STAMP';/g" sw.js
          fi

          # Salva tudo de volta no repositorio automaticamente
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-Update: Arquivos extraidos e modulos injetados [skip ci]" || true
          git push || true

      - name: 3. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 5. Empacotar Web e Sincronizar Android
        run: |
          npm install
          mkdir -p www
          cp *.html *.json *.js *.svg www/ 2>/dev/null || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Compilar APK Atualizado
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Omniverse-Android-APK-Atualizado
          path: android/app/build/outputs/apk/debug/app-debug.apk
